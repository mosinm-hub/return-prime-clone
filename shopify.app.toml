client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "returns-and-exchanges"
handle = "returns-and-exchanges"
application_url = "https://REPLACE_WITH_YOUR_APP_URL"
embedded = true

[access_scopes]
# orders: read order/line-item data for return + cancellation eligibility;
#   write_orders needed to actually cancel an order (orderCancel mutation)
# products: look up variants for exchange suggestions
# draft_orders: create exchange draft orders
# customers: attach return/cancellation history to a customer
# fulfillments: read fulfillment/tracking events to detect RTO
# inventory: restock inventory automatically when an RTO parcel arrives
scopes = "read_orders,write_orders,read_products,write_draft_orders,read_customers,read_fulfillments,write_inventory"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_YOUR_APP_URL/auth/callback",
  "https://REPLACE_WITH_YOUR_APP_URL/auth/shopify/callback",
  "https://REPLACE_WITH_YOUR_APP_URL/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds/create"

  [[webhooks.subscriptions]]
  topics = ["fulfillment_events/create"]
  uri = "/webhooks/fulfillment_events/create"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

[app_proxy]
url = "https://REPLACE_WITH_YOUR_APP_URL/proxy"
subpath = "returns"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
dev_store_url = "REPLACE_WITH_YOUR_DEV_STORE.myshopify.com"
